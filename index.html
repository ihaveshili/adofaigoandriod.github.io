<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>ADOFAI 启动器</title>
    <style>
        :root {
            --bg: #0d0d0f;
            --card: #1a1a20;
            --border: #2a2a35;
            --text: #e8e8e8;
            --text2: #9a9ab0;
            --green: #4caf50;
            --greenDark: #388e3c;
            --blue: #42a5f5;
            --blueDark: #1e88e5;
            --orange: #ff9800;
            --radius: 12px;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }
        .launcher {
            width: 100%;
            max-width: 420px;
            background: var(--card);
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            overflow: hidden;
            position: relative;
        }
        .header {
            padding: 16px 20px;
            background: linear-gradient(180deg, #1e1e28 0%, #16161e 100%);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7c4dff, #4a00e0);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 14px;
            color: #fff;
            flex-shrink: 0;
            box-shadow: 0 0 12px rgba(124, 77, 255, 0.4);
        }
        .header h1 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #fff;
        }
        .header .sub {
            font-size: 11px;
            color: var(--text2);
            font-weight: 400;
            letter-spacing: 1px;
        }
        .body {
            padding: 24px 20px 20px;
        }
        .version-card {
            background: #20202a;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            text-align: center;
            position: relative;
            transition: all 0.3s ease;
        }
        .version-card.highlight {
            border-color: var(--green);
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.25);
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                box-shadow: 0 0 20px rgba(76, 175, 80, 0.25);
            }
            50% {
                box-shadow: 0 0 30px rgba(76, 175, 80, 0.45);
            }
        }
        .icon-wrap {
            width: 88px;
            height: 88px;
            margin: 0 auto 14px;
            cursor: pointer;
            position: relative;
            transition: transform 0.2s ease;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            -webkit-touch-callout: none;
        }
        .icon-wrap:active {
            transform: scale(0.93);
        }
        .icon-wrap.disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }
        .icon-wrap.disabled:active {
            transform: none;
        }
        .icon {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, #5c6bc0, #3949ab);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            box-shadow: 0 6px 24px rgba(57, 73, 171, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            border: 3px solid #3f51b5;
            transition: all 0.3s ease;
            position: relative;
        }
        .icon .ver {
            font-size: 16px;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.4);
            letter-spacing: 0.5px;
            line-height: 1.2;
            transition: all 0.3s ease;
        }
        .icon .tag {
            font-size: 9px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.75);
            letter-spacing: 1px;
            margin-top: 2px;
            transition: all 0.3s ease;
        }
        .icon.installed {
            background: linear-gradient(135deg, #66bb6a, #2e7d32);
            border-color: #4caf50;
            box-shadow: 0 6px 24px rgba(76, 175, 80, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }
        .icon.installed .ver {
            font-size: 20px;
        }
        .icon.installed .tag {
            color: rgba(255, 255, 255, 0.9);
        }
        .version-name {
            font-size: 17px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 4px;
        }
        .version-type {
            font-size: 11px;
            color: var(--text2);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
        }
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
            background: #2a2a35;
            color: var(--text2);
            transition: all 0.3s ease;
        }
        .badge.not-dl {
            background: #3a2a2a;
            color: #ef9a9a;
        }
        .badge.dl-ing {
            background: #2a2a3a;
            color: #90caf9;
        }
        .badge.dl-done {
            background: #2a3a2a;
            color: #a5d6a7;
        }
        .badge.ready-badge {
            background: #1a3a1a;
            color: #81c784;
            border: 1px solid #4caf50;
        }
        .hint {
            font-size: 12px;
            color: var(--text2);
            margin-top: 12px;
            line-height: 1.5;
            min-height: 20px;
            transition: all 0.3s ease;
        }
        .hint.success {
            color: #81c784;
        }
        .hint.warn {
            color: #ffcc80;
        }
        .progress-wrap {
            width: 100%;
            height: 6px;
            background: #2a2a35;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 14px;
